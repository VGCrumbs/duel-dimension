// The Minecraft 1.21.1 platform.
//
// A skeleton: it holds the toolchain and one file that proves the toolchain
// works. No ported code yet -- that is Phase 1 onwards, and the port is a real
// one, because 1.21.1 and 26.2 are far enough apart that the client layer has
// to be written twice (retained-mode GUI, the item-model split, the NBT
// accessor change, and ResourceLocation/Identifier all land between them).
//
// WHAT THIS MODULE EXISTS TO PROVE, before anybody ports anything into it:
//   1. Loom resolves 1.21.1 alongside a 26.2 module in the same build.
//   2. `common` -- compiled to Java 21, against no Minecraft at all -- is
//      usable from a 1.21.1 module.
//   3. Mojang names work here, so ported code keeps the vocabulary it is
//      already written in.

plugins {
    // NOT the root's loom_version. 1.17.18 cannot configure an obfuscated
    // Minecraft, and 1.21.1 is obfuscated; this is the newest Loom that still
    // ships the mappings pipeline 1.21.x needs.
    //
    // `fabric-loom`, the SHORT id, and not `net.fabricmc.fabric-loom`. Checked
    // against the Fabric maven's own metadata rather than assumed: the long id's
    // plugin marker is published for 1.17.x only, while the short id's goes back
    // through 1.11. The root build uses the long one because 1.17.18 has it.
    id 'fabric-loom' version '1.12.7'
    id 'java-library'
}

// Its own build, so nothing is inherited from the root.
version = '0.1.0-fabric'
group = 'de.cas_ual_ty.dueldimension'

base {
    archivesName = 'dueldimension-fabric-1.21.1'
}

java {
    // 1.21.1 runs on Java 21. The 26.2 platform is on 25; they do not have to
    // agree, and `common` is built to 21 so both can load it.
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

loom {
    // ONE ACCESS WIDENER, generated rather than written -- see
    // tools/gen_accesswidener.py. It opens RenderType.create and the state
    // shards, so the models can be drawn nearest-surface-only: depth in one
    // pass, colour in a second with the depth test set to EQUAL. Neither type
    // exists in vanilla.
    accessWidenerPath = file('src/main/resources/dueldimension.accesswidener')

    // WHAT IT DOES NOT OPEN, and why -- mc262 carries four entries and every
    // one of them turned out to be a 26.2 problem:
    //   MenuType's constructor and its MenuSupplier -- both public here.
    //   MenuScreens.register and its ScreenConstructor -- public here.
    //   ItemModels.ID_MAPPER -- the whole model-type registry is 1.21.4+; the
    //     binding is per ITEM through Fabric, so there is nothing to widen.
    //   RenderType.create -- only wanted for the unowned-card pipeline, which
    //     does not exist here (UnownedPipelines.available() is false).
    //
    // One place wanted one and did not get it: ItemRenderer.renderQuadList and
    // renderModelLists are both private. DiskCardsItemModel goes in through the
    // public ItemRenderer.render with ItemDisplayContext.NONE instead, whose
    // transform is the identity -- same work, no widening.

    runs {
        client {
            // Both lines are mc262's, verbatim, and for its reasons.
            //
            // The account name, so a screenshot from either tree is recognisably
            // the same player -- and so PlayerSkins can resolve a skin for it. A
            // dev client is offline, so the game has nowhere to fetch one from
            // and every dev player is Steve unless the mod supplies it.
            programArgs '--username', 'Alpha'

            // 920p, because the duel screen is laid out in logical GUI pixels
            // and the window size decides how much board there is to lay out on.
            // Matching mc262 means a layout checked in one tree is the layout in
            // the other -- which is the whole point of two builds at parity.
            programArgs '--width', '1634', '--height', '920'
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

// Same as the 26.2 platform: common's classes have to be INSIDE the mod jar.
// A dependency puts them on the classpath, which is enough for a dev run and
// not for a shipped jar. Established the hard way on mc262, whose first jar
// after the split had no rules engine in it; wired here now so Phase 1 does not
// rediscover it.
//
// Not transitive -- JNA and sqlite are bundled deliberately by Loom's `include`,
// and gson, guava and the logging facade come from Minecraft at runtime.
configurations {
    bundledCore {
        transitive = false
        canBeConsumed = false
    }
}

dependencies {
    bundledCore 'de.cas_ual_ty.dueldimension:common:0.1.0-fabric'

    minecraft 'com.mojang:minecraft:1.21.1' 

    // MOJANG NAMES, not Yarn, and this is the decision that makes the port
    // possible at all.
    //
    // 26.2 ships unobfuscated, so the whole codebase is already written in
    // Mojang's vocabulary -- `ResourceLocation`, `LivingEntity`, `PoseStack`.
    // 1.21.1 IS obfuscated and needs a mapping set chosen here. Yarn would
    // rename everything and turn every ported file into a translation exercise
    // on top of the version differences it already has. Official mappings mean
    // a file moved from mc262 differs only where the API genuinely differs.
    //
    // This is also the one real toolchain divergence between the platforms:
    // 26.2 has no mappings dependency and no remapping step; here both exist.
    mappings loom.officialMojangMappings()

    modImplementation 'net.fabricmc:fabric-loader:0.16.14'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.116.15+1.21.1'

    // The shared core. Same module the 26.2 platform uses, same classes, no
    // per-version copy -- named by coordinate and substituted by the composite.
    api 'de.cas_ual_ty.dueldimension:common:0.1.0-fabric'

    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation testFixtures('de.cas_ual_ty.dueldimension:common:0.1.0-fabric')
}

// ---------------------------------------------------------------------------
// The bundled rules engine.
//
// THE SAME THREE TASKS AS mc262, reading the SAME three directories at the
// repository root. Not a copy of the engine -- a second reader of it. See
// mc262/build.gradle for the long version of why the scripts and the database
// are zipped into one jar entry each rather than shipped as 12,727 and 14,686
// names, and why the bundle stamps itself with a digest over its own bytes.
//
// This module went without it for the whole port and the omission was invisible
// until the client ran: the mod fell back to whatever EDOPro install the machine
// happened to have, found a 32-bit ocgcore.dll under C:\ProjectIgnis, and said
// so in chat. A player with no EDOPro would have got "install EDOPro first",
// which is exactly the second download the bundle exists to remove.
// ---------------------------------------------------------------------------
def engineBundleOut = layout.buildDirectory.dir('generated/engine-bundle')

tasks.register('engineScriptsZip', Zip) {
    description = 'Packs the bundled card scripts into the single jar entry the mod unpacks at runtime.'
    from layout.projectDirectory.dir('../bundle/script')
    archiveFileName = 'script.zip'
    destinationDirectory = engineBundleOut.map { it.dir('dueldimension_engine') }
    // Reproducible, because the bundle is versioned by hashing its own bytes:
    // timestamps and directory order would change the digest on every build and
    // re-unpack 28 MB on every player's machine for no reason at all.
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.register('cardDatabaseZip', Zip) {
    description = 'Packs the bundled card database into the single jar entry the mod unpacks at runtime.'
    from layout.projectDirectory.dir('../bundle/ydm_db')
    archiveFileName = 'ydm_db.zip'
    destinationDirectory = engineBundleOut.map { it.dir('dueldimension_engine') }
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.register('engineBundleStamp') {
    description = 'Stamps the engine bundle with a version derived from its contents.'
    dependsOn tasks.named('engineScriptsZip'), tasks.named('cardDatabaseZip')

    def payloadDir = layout.projectDirectory.dir('../bundle/payload')
    def provenanceFile = layout.projectDirectory.file('../bundle/provenance.properties')
    def scriptsZip = tasks.named('engineScriptsZip', Zip).flatMap { it.archiveFile }
    def cardDbZip = tasks.named('cardDatabaseZip', Zip).flatMap { it.archiveFile }
    def stamp = engineBundleOut.map { it.file('dueldimension_engine/bundle.properties') }
    def modVersion = project.version.toString()

    inputs.dir(payloadDir)
    inputs.file(provenanceFile)
    inputs.file(scriptsZip)
    inputs.file(cardDbZip)
    inputs.property('modVersion', modVersion)
    outputs.file(stamp)

    doLast {
        // Neither cards.cdb nor the script tree carries a version of its own, so
        // the bundle stamps itself: a digest over the CONTENT of everything it
        // ships. Stable across rebuilds, changes the moment any shipped byte
        // does, and is what the unpacked copy on disk is compared against.
        def payloadRoot = payloadDir.asFile.toPath()
        def parts = [['script.zip', scriptsZip.get().asFile]]
        payloadDir.asFile.eachFileRecurse(groovy.io.FileType.FILES) { file ->
            parts << [payloadRoot.relativize(file.toPath()).toString().replace('\\', '/'), file]
        }
        parts.sort { it[0] }

        def whole = java.security.MessageDigest.getInstance('SHA-256')
        long bytes = 0
        parts.each { name, file ->
            def each = java.security.MessageDigest.getInstance('SHA-256')
            file.withInputStream { input ->
                byte[] buffer = new byte[1 << 16]
                int read
                while((read = input.read(buffer)) > 0)
                {
                    each.update(buffer, 0, read)
                }
            }
            bytes += file.length()
            whole.update("${name}:${each.digest().encodeHex()}\n".getBytes('UTF-8'))
        }

        // The card database is digested SEPARATELY. Folding it into `version`
        // would make every existing player re-unpack 28 MB of card scripts the
        // first time they launched a build that carries a database, and adding
        // cards to the jar is not a reason to rewrite a single Lua file.
        def cardDb = cardDbZip.get().asFile
        def cardDbDigest = java.security.MessageDigest.getInstance('SHA-256')
        cardDb.withInputStream { input ->
            byte[] buffer = new byte[1 << 16]
            int read
            while((read = input.read(buffer)) > 0)
            {
                cardDbDigest.update(buffer, 0, read)
            }
        }
        def cardDbFiles = 0
        new java.util.zip.ZipFile(cardDb).withCloseable { zip ->
            cardDbFiles = zip.entries().toList().count { !it.directory }
        }

        def provenance = new Properties()
        provenanceFile.asFile.withInputStream { provenance.load(it) }

        def target = stamp.get().asFile
        target.parentFile.mkdirs()
        // Written by hand rather than with Properties.store, which stamps the
        // file with the time it was written and would make every build differ.
        def text = new StringBuilder()
        text << '# Generated by the engineBundleStamp task. Do not edit.\n'
        text << '# bundle.version is a SHA-256 over the content of every file shipped\n'
        text << '# in this bundle; it is what the unpacked copy under the game\n'
        text << '# directory is compared against to decide whether to unpack again.\n'
        text << "version=${whole.digest().encodeHex().toString().substring(0, 16)}\n"
        text << "files=${parts.size()}\n"
        text << "bytes=${bytes}\n"
        text << "carddb.version=${cardDbDigest.digest().encodeHex().toString().substring(0, 16)}\n"
        text << "carddb.files=${cardDbFiles}\n"
        text << "carddb.bytes=${cardDb.length()}\n"
        text << "mod.version=${modVersion}\n"
        provenance.stringPropertyNames().sort().each { key ->
            text << "${key}=${provenance.getProperty(key)}\n"
        }
        target.text = text.toString()
        logger.lifecycle("Engine bundle stamped: ${target.readLines().find { it.startsWith('version=') }}, ${parts.size()} parts, ${bytes} bytes")
    }
}

sourceSets {
    main {
        resources {
            // The shared asset tree.
            //
            // mc262 and mc1211 are separate BUILDS -- two Minecraft versions cannot share
            // one -- and until now they each carried a full copy of every texture, model
            // and sound. That is 1,322 identical files duplicated, and it showed: a pass
            // that compressed the textures in one tree left the other jar 22 MB larger,
            // because the two are not the same files on disk.
            //
            // Only what genuinely differs between versions stays in each module's own
            // src/main/resources: the item models (the model JSON format changed), one
            // recipe, and the three build descriptors. Gradle merges the two directories at
            // processResources, so a module can still override a shared file simply by
            // keeping its own copy -- the manifest of what moved is shared/SHARED_FILES.txt.
            srcDir file('../shared/resources')
            srcDir file('../bundle/payload')
            srcDir engineBundleOut
        }
    }
}

processResources {
    dependsOn tasks.named('engineScriptsZip'), tasks.named('cardDatabaseZip'),
        tasks.named('engineBundleStamp')

    // fabric.mod.json names the version once, here, rather than in the file --
    // a version in two places is a version that disagrees with itself.
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

jar {
    // AGPL-3.0 section 4: "give all recipients a copy of this License along
    // with the Program". Naming a licence is not giving one. These four files
    // are the notices that have to travel with the artefact -- the same four
    // mc262 carries, for the same clause.
    from(file('../LICENSE')) { rename { 'LICENSE-GPL-3.0.txt' } }
    from(file('../LICENSE-AGPL-3.0.txt'))
    from(file('../CREDITS.md'))
    from(file('../NOTICE.md'))
}

tasks.named('jar', Jar) {
    // dependsOn the CONFIGURATION, not just its files. `from { ... zipTree }`
    // is a closure, so Gradle cannot see through it to infer that common's jar
    // has to exist first -- and across a composite that means the jar task can
    // start while the other build is still writing it. It failed exactly that
    // way once: "Cannot expand ZIP common-0.1.0-fabric.jar".
    dependsOn configurations.bundledCore
    from({ configurations.bundledCore.collect { zipTree(it) } }) {
        exclude 'META-INF/**'
    }
}

test {
    useJUnitPlatform()

    // THE BUNDLED ENGINE, not this machine's EDOPro install -- mc262's four
    // properties, verbatim, and for its reason: pointing them at bundle/ makes
    // the suite exercise exactly what goes into the jar, rather than proving the
    // engine works on the developer's machine.
    //
    // Sixteen tests skipped themselves with "native core not present" until this
    // existed, and a suite that reports 437 passing while sixteen of them quietly
    // did nothing is worse than one that fails. They are the tests that actually
    // run duels -- board concealment, prompt translation, replay determinism,
    // both-seats-playable -- so they are most of what "the rules engine works on
    // 1.21.1" means.
    //
    // ../-relative because mc1211 is an INCLUDED BUILD: rootProject is this
    // module, not the repository. Same correction as the engine-bundle tasks.
    def enginePayload = file('../bundle/payload/dueldimension_engine')
    systemProperty 'ocg.lib', project.findProperty('ocgLib')
        ?: new File(enginePayload, 'native/win32-x86-64/ocgcore.dll').absolutePath
    systemProperty 'ocg.scripts', project.findProperty('ocgScripts')
        ?: file('../bundle/script').absolutePath
    systemProperty 'ocg.cdb', project.findProperty('ocgCdb')
        ?: new File(enginePayload, 'expansions/cards.cdb').absolutePath
    systemProperty 'ocg.strings', project.findProperty('ocgStrings')
        ?: new File(enginePayload, 'config/strings.conf').absolutePath
}

// Show every error, not the first hundred. A port produces errors in bulk and
// javac's default cap hides how much is actually left.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-Xmaxerrs' << '2000'
}

// WHAT IS IN THE BUILD, while the port is under way.
//
// The alternative was 348 ported files all failing at once, which is a bad place
// to work from: with no green state nothing can regress, and every edit is judged
// by whether an error count went down rather than by whether it worked.
//
// So the build compiles only what compiles. port-excludes.txt lists the rest --
// generated by tools/port_green.py, one line per file still to do. Fix a file,
// delete its line, build. A red build then means the fix was wrong, which is the
// feedback the port had been missing.
//
// The file is empty the day the port is done, and this block can go with it.
def portExcludes = file('port-excludes.txt')
if(portExcludes.exists())
{
    def skip = portExcludes.readLines()
        .findAll { !it.trim().isEmpty() && !it.trim().startsWith('#') }
        .collect { it.trim() }
    sourceSets.main.java.exclude(skip)
    logger.lifecycle("mc1211: ${skip.size()} file(s) excluded while porting")
}

// Where a 1.21.1 build goes. The 26.2 platform names a different profile; see
// mc262/build.gradle. Two Minecraft versions, two Modrinth instances, and a jar
// in the wrong one is a mod that refuses to load with a version-mismatch error
// that names neither of them helpfully.
ext.exportTo = 'C:/Users/Admin/AppData/Roaming/ModrinthApp/profiles/Cobblemon'
apply from: file('../gradle/export-jar.gradle')
