# Its own build, so it has its own properties: the root's are not visible here.
#
# Pinned to what is already resolved on this machine, so a first build does not
# depend on the network. These deliberately do NOT match the 26.2 platform's --
# the two versions agree about nothing here, which is the whole reason they are
# separate builds.
org.gradle.jvmargs=-Xmx4G
