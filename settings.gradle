pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = 'dueldimension'

// A COMPOSITE, not a multi-project build, and the reason is a hard constraint
// rather than a preference.
//
// mc262 needs Loom 1.17.18, which Minecraft 26.2 requires. mc1211 needs an
// older Loom, because 1.17 dropped the obfuscated pipeline that 1.21.1 depends
// on -- measured: officialMojangMappings() there throws "Cannot use Mojang
// mappings in a non-obfuscated environment", and it fails the same way with
// mc262 removed from the build, so it is the plugin and not shared state.
//
// A Gradle build resolves ONE version of a plugin, in the block above. So each
// platform is its own BUILD, pinning its own Loom in its own settings file, and
// this composite ties them together.
//
// `common` is a build too, for a consequence of the same thing: a build
// included in a composite can see other included builds, and cannot see another
// build's subprojects. Were common a subproject here, mc1211 could not reach it
// and would need its own copy.
//
// Dependencies between them are declared by COORDINATE
// (`de.cas_ual_ty.dueldimension:common:0.1.0-fabric`); Gradle substitutes the
// local source for it and never goes to a repository.
includeBuild 'common'
includeBuild 'mc1211'

// mc262 stays a subproject of the root: the root has to apply SOME Loom for it,
// and 1.17.18 is the one it needs anyway.
include 'mc262'
