# Where each piece of the bundled rules engine came from.
#
# Merged verbatim into dueldimension_engine/bundle.properties by the
# engineBundleStamp task, so it ships inside the jar and can be read back with
# EngineBundle.describe(). Update it in the same commit that refreshes the
# payload -- a snapshot whose provenance is a guess is worse than no snapshot.
#
# Neither the card scripts nor cards.cdb carries a version of its own (PRAGMA
# user_version is 0, there is no .git under script/), and upstream's version is
# a commit in ProjectIgnis/DeltaBagooska, which ships the core and the scripts
# together because the Lua surface IS the core's ABI. This file is the only
# record of which snapshot was taken; bundle.version identifies its bytes.

scripts.source=https://github.com/ProjectIgnis/CardScripts
scripts.via=EDOPro installer, C:/ProjectIgnis/script (root + official/ only; rush, skill, goat, unofficial and pre-errata are never read by this mod)
scripts.snapshot=2025-04-28
scripts.licence=AGPL-3.0-or-later (script/COPYING.txt, md5 4ae09d45eac4aa08d013b5f2e01c67f6, kept verbatim inside script.zip)

cdb.source=https://github.com/ProjectIgnis/BabelCDB
cdb.distributed.via=https://github.com/ProjectIgnis/DeltaPuppetOfStrings and https://github.com/ProjectIgnis/DeltaBagooska, which is where EDOPro fetches it and which is where the AGPL grant comes from -- BabelCDB itself carries no licence file
cdb.snapshot=2025-04-28
cdb.sha256=c49a077285e1d999f32056cb65303b75e311e859b4486c48f41772a193069225
cdb.licence=AGPL-3.0-or-later

strings.source=https://github.com/ProjectIgnis/DeltaBagooska
strings.via=EDOPro installer, C:/ProjectIgnis/config/strings.conf
strings.sha256=1f243804824f97ebcb8162a8130d0e5b90558907b8163a4dc2ff4bf0e548351b
strings.licence=AGPL-3.0-or-later

core.source=https://github.com/edo9300/ygopro-core
core.commit=623c31a925630639b2978968b2024b104ae3abca
core.commit.date=2026-07-31
core.commit.subject=return false when checking if a card can be a material for itself
core.build=64-bit x86, CMake + MSVC Release, built 2026-08-04 from ocgcore-build/CMakeLists.txt in the Forge tree of this project; exports OCG API 11.0 and links the bundled Lua 5.4.8 compiled as C++
core.sha256=9137cc3cd46c12e57d3054ca873fb68b50a918f1be3fa1db0cc50ba196e97ba7
core.licence=AGPL-3.0-or-later, plus MIT for the Fluorohydride ancestor and for Lua (COPYING.ocgcore.txt)
core.licence.file=COPYING.ocgcore.txt is ygopro-core's own LICENSE at the commit above, byte for byte (md5 af276b0f91393f013b1c82a3d87b97aa, CRLF as upstream writes it). It was taken from the source the binary was built from and NOT from EDOPro's notices/COPYING.ocgcore.txt, which is the same file from an older release and still reads "Copyright (C) 2019-2025"; the notice shipped beside a binary has to be the notice from that binary's own source.
core.corresponding.source=https://github.com/edo9300/ygopro-core/tree/623c31a925630639b2978968b2024b104ae3abca -- unmodified upstream sources at that commit, plus the build script at ocgcore-build/CMakeLists.txt. Established by hash, not by memory: build/Release/ocgcore.dll in that build tree is byte-identical to the shipped binary (sha256 above), its CMakeCache records CORE_DIR as the checkout, the checkout is clean at this commit, and its newest source file predates the build by two minutes.

carddb.source=https://github.com/CAS-ual-TY/YDM2-DB, plus this project's own tools/update_card_db.py
carddb.split=10756 of the 13862 card files and 357 of the 691 set files are YDM2-DB's, established by listing both trees and comparing; the remaining 3106 cards and 334 sets were generated here from YGOPRODeck's public API by tools/update_card_db.py, which is the same source YDM2-DB is itself built from
carddb.serialisation=re-serialised, not copied byte for byte -- ours are LF where YDM2-DB's are CRLF -- so no hash matches upstream. Content is identical for 10755 of the 10756 shared card files; elemental_hero_stratos.json is the sole exception. The Unlicense permits "copy, modify, publish", so reformatting is inside the grant; only byte-identity is not claimed.
carddb.licence=Unlicense (public domain dedication), shipped verbatim as UNLICENSE.txt inside ydm_db.zip, md5 d512eeaf0d5285acc53d4569054cbb08, byte-identical to YDM2-DB's own LICENSE
carddb.rarity.images=all 23 PNGs in rarity_images/ are byte-identical to YDM2-DB's, established by md5; they are CAS_ual_TY's work under the same Unlicense and are NOT EDOPro's
carddb.konami=the card names, effect texts and stats are Konami's and no dedication by anyone else touches that. YGOPRODeck's own API guide states it: "The literal and graphical information presented on this site about Yu-Gi-Oh!, including card images, the attribute, level/rank and type symbols, and card text, is copyright 4K Media Inc, a subsidiary of Konami Digital Entertainment, Inc." This is a fan project on the same footing as the database it forks.
carddb.artwork.bundled=no
carddb.artwork.why=no card artwork is shipped. Every card file names its image as a URL at images.ygoprodeck.com, which the mod fetches per installation, and YGOPRODeck asks exactly that: "Do not continually hotlink images directly from this site. Please download and re-host the images yourself."
carddb.altart.bundled=no
carddb.altart.why=ydm_db/alt_art holds extended-art scans taken from Yugipedia, whose Yugipedia:Licensing page licenses "the text on Yugipedia" under CC BY-SA 4.0 and says nothing for card images; the file page for one of them states "This work is copyrighted and unlicensed" and "Any other uses of this image may be copyright infringement". That is a fair-use claim by a wiki, and it does not travel into a mod jar. The mod still reads alt_art/ when it is present; tools/fetch_mamo_extended_art.py fetches it on the player's own machine.

banlists.bundled=no
banlists.why=https://github.com/ProjectIgnis/LFLists carries no licence file of any kind (GitHub's licence API returns 404; the repository root holds only .gitattributes and the .lflist.conf files), and unlike cards.cdb there is no distribution repository that supplies one -- EDOPro fetches LFLists directly. No permission to redistribute has been granted, so the lists are discovered from an EDOPro install or from <gamedir>/lflists and are not shipped.
