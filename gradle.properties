# The Gradle daemon needs headroom for Loom's remapping of the Minecraft jar.
org.gradle.jvmargs=-Xmx4G

# The Fabric stack, pinned on 2026-08-07 from meta.fabricmc.net / Modrinth.
# Minecraft moved to date-based versions; 26.2 is the current stable and it
# requires Java 25 (per its own launcher manifest), which this machine has.
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17.18
fabric_api_version=0.156.0+26.2

mod_version=0.1.0-fabric
maven_group=de.cas_ual_ty.dueldimension
archives_base_name=dueldimension-fabric

# ---------------------------------------------------------------------------
# The 1.21.1 platform.
#
# Separate keys, not a shared one: the two platforms agree about nothing here.
# 1.21.1 is obfuscated and needs mappings; 26.2 is not and has none. 1.21.1
# runs on Java 21; 26.2 needs 25. Pinned to what is already resolved on this
# machine so the first build does not depend on the network.
mc1211_minecraft_version=1.21.1
mc1211_loader_version=0.16.14
mc1211_fabric_api_version=0.116.15+1.21.1
