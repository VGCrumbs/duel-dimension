plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'java-library'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    // MenuType's constructor is private on 26.2 and Fabric's screen-handler
    // helper is unusable here, so the mod widens the constructor to build its
    // own menu types. See the file's header for the full reason.
    accessWidenerPath = file("src/main/resources/dueldimension.accesswidener")

    mods {
        "dueldimension" {
            sourceSet sourceSets.main
        }
    }

    runs {
        client {
            // The same account name the Forge workspace runs under, so a
            // screenshot from either tree is recognisably the same player --
            // and so PlayerSkins can resolve a skin for it. See that class:
            // a dev client is offline, so the game has nowhere to fetch one
            // from and every dev player is Steve unless the mod supplies it.
            programArgs "--username", "Alpha"

            // The duel screen is laid out in logical GUI pixels, so the window
            // size decides how much board there is to lay out on. The Forge
            // workspace fixes it at 920p for that reason; matching it means a
            // layout checked in one tree is the layout in the other.
            programArgs "--width", "1634", "--height", "920"
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // No mappings dependency and no remapping: Minecraft stopped shipping
    // obfuscated with the move to date versions, so the jar's own names ARE
    // Mojang's names -- the same vocabulary the Forge tree was written against
    // (ForgeGradle's parchment channel layered docs over official names),
    // which is what lets ported files keep their vanilla references untouched.
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // JNA for the ocgcore (EDOPro-core) rules engine binding — the reason this
    // mod exists, and loader-agnostic: pure Java over a native library.
    implementation 'net.java.dev.jna:jna:5.13.0'
    include 'net.java.dev.jna:jna:5.13.0'

    // SQLite driver for reading BabelCDB card databases (cards.cdb).
    implementation 'org.xerial:sqlite-jdbc:3.42.0.0'
    include 'org.xerial:sqlite-jdbc:3.42.0.0'

    // javax.annotation.Nullable, which the upstream mod's sources use
    // throughout. Compile-only: it is documentation for javac, not something
    // the mod needs at runtime.
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    // What Minecraft 26.2 itself requires, per its launcher manifest.
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

test {
    useJUnitPlatform()
    // The engine artefacts live outside the repo; same knobs as the Forge tree,
    // so the same native-core tests run (and skip themselves when absent).
    systemProperty 'ocg.lib', project.findProperty('ocgLib') ?: 'native/ocgcore.dll'
    systemProperty 'ocg.scripts', project.findProperty('ocgScripts') ?: 'C:/ProjectIgnis/script'
    systemProperty 'ocg.cdb', project.findProperty('ocgCdb') ?: 'C:/ProjectIgnis/expansions/cards.cdb'
    systemProperty 'ocg.strings', project.findProperty('ocgStrings') ?: 'C:/ProjectIgnis/config/strings.conf'
}

// javac stops at 100 errors by default, which hides how much is actually left
// during a large port -- the count looked stuck at 100 for three passes running
// while real progress was being made underneath it.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-Xmaxerrs' << '10000'
}
