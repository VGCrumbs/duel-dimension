// The root holds no code.
//
// It used to BE the 26.2 build; that build is `mc262` now, and this is a
// container for it, for `common`, and for the 1.21.1 platform when it arrives.
// Keeping the root a platform would have meant the second platform was a
// subproject of the first, inheriting its Loom configuration and its Minecraft
// version -- which is exactly the coupling this split exists to remove.
//
// Everything version-specific lives in a platform's own build file, because the
// two platforms genuinely disagree about the basics:
//
//   * 26.2 ships UNOBFUSCATED, so there is no mappings dependency and no
//     remapping step anywhere. 1.21.1 predates that and needs both.
//   * 26.2 requires Java 25; 1.21.1 requires Java 21.
//
// There is no shared Loom block to hoist. Only the things that are true of any
// Java in this repository are set here.

// No `plugins` block: the root compiles nothing, and `java-library` is a core
// plugin, so requesting it here with `apply false` is an error rather than the
// no-op it looks like.

subprojects {
    repositories {
        mavenCentral()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        testLogging {
            events 'failed'
            exceptionFormat 'full'
        }
    }
}

// Convenience: `gradlew25 buildAll` does every platform. Named rather than
// reusing `build`, which at the root would also try to build `common` twice
// through two different paths.
tasks.register('buildAll') {
    group = 'build'
    description = 'Builds the shared core and every Minecraft platform.'
    dependsOn ':common:build', ':mc262:build'
}
